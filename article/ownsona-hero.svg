<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1437"/>
      <stop offset="0.55" stop-color="#162a63"/>
      <stop offset="1" stop-color="#1f3b8f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#7fd1ff"/>
      <stop offset="0.5" stop-color="#3a8be0"/>
      <stop offset="1" stop-color="#1b4fb0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce8ff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="840" fill="url(#bg)"/>

  <!-- faint grid dots -->
  <g fill="#9db8ff" opacity="0.10">
    <!-- scattered dots for texture -->
    <circle cx="120" cy="120" r="3"/><circle cx="300" cy="80" r="2.5"/><circle cx="520" cy="140" r="2"/>
    <circle cx="1480" cy="120" r="3"/><circle cx="1300" cy="70" r="2.5"/><circle cx="1100" cy="150" r="2"/>
    <circle cx="160" cy="720" r="2.5"/><circle cx="420" cy="760" r="2"/><circle cx="1440" cy="730" r="3"/>
    <circle cx="1180" cy="770" r="2"/><circle cx="760" cy="60" r="2"/><circle cx="860" cy="790" r="2.5"/>
  </g>

  <!-- center of hub -->
  <g transform="translate(800,420)">
    <!-- connection spokes (drawn first, behind nodes) -->
    <g stroke="#8fb6ff" stroke-width="3" opacity="0.55" fill="none">
      <line x1="0" y1="0" x2="-470" y2="-210"/>
      <line x1="0" y1="0" x2="-520" y2="60"/>
      <line x1="0" y1="0" x2="-430" y2="250"/>
      <line x1="0" y1="0" x2="470" y2="-210"/>
      <line x1="0" y1="0" x2="520" y2="60"/>
      <line x1="0" y1="0" x2="430" y2="250"/>
    </g>
    <!-- moving data pips along spokes -->
    <g fill="#bfe0ff">
      <circle cx="-235" cy="-105" r="5"/><circle cx="-260" cy="30" r="5"/><circle cx="-215" cy="125" r="5"/>
      <circle cx="235" cy="-105" r="5"/><circle cx="260" cy="30" r="5"/><circle cx="215" cy="125" r="5"/>
    </g>

    <!-- glow behind core -->
    <circle cx="0" cy="0" r="150" fill="#3a8bff" opacity="0.5" filter="url(#dropglow)"/>

    <!-- central memory core -->
    <circle cx="0" cy="0" r="118" fill="url(#core)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#cfe6ff" stroke-width="3" opacity="0.8"/>

    <!-- brain / memory glyph: stacked database rings -->
    <g stroke="#0b1437" stroke-width="5" fill="none" opacity="0.85">
      <ellipse cx="0" cy="-34" rx="52" ry="18"/>
      <path d="M -52 -34 V 34 a 52 18 0 0 0 104 0 V -34"/>
      <path d="M -52 0 a 52 18 0 0 0 104 0"/>
    </g>

    <text x="0" y="190" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="1">OwnSona</text>
    <text x="0" y="232" text-anchor="middle" fill="#bcd2ff" font-size="27" letter-spacing="3">YOUR&#160;OWN&#160;PERSONA</text>
  </g>

  <!-- client chips -->
  <g font-size="30" font-weight="600" text-anchor="middle">
    <!-- top-left ChatGPT -->
    <g transform="translate(330,210)">
      <rect x="-118" y="-42" rx="22" ry="22" width="236" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">ChatGPT</text>
    </g>
    <!-- mid-left Claude -->
    <g transform="translate(280,480)">
      <rect x="-110" y="-42" rx="22" ry="22" width="220" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">Claude</text>
    </g>
    <!-- bottom-left Gemini -->
    <g transform="translate(370,670)">
      <rect x="-112" y="-42" rx="22" ry="22" width="224" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">Gemini</text>
    </g>
    <!-- top-right Grok -->
    <g transform="translate(1270,210)">
      <rect x="-100" y="-42" rx="22" ry="22" width="200" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">Grok</text>
    </g>
    <!-- mid-right Copilot -->
    <g transform="translate(1320,480)">
      <rect x="-118" y="-42" rx="22" ry="22" width="236" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">Copilot</text>
    </g>
    <!-- bottom-right any MCP client -->
    <g transform="translate(1230,670)">
      <rect x="-150" y="-42" rx="22" ry="22" width="300" height="84" fill="url(#chip)"/>
      <text x="0" y="10" fill="#16306b">any MCP client</text>
    </g>
  </g>

  <!-- tagline strip -->
  <text x="800" y="86" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="0.5">One memory. Every LLM.</text>
  <text x="800" y="790" text-anchor="middle" fill="#9fbcff" font-size="26">A personal-memory server shared across every AI assistant you use</text>
</svg>
